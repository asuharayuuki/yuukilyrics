name: Build Android APK

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      ANDROID_DEBUG_KEYSTORE_BASE64:
        required: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'

      - name: Show build environment
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/yuukilyrics-release.keystore
          EXPECTED_CERT_SHA256: 67356005284c1cac474ce25478b49de4abbc776660685a0f3089b083fe2a9b84
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          ACTUAL_CERT_SHA256=$(keytool -exportcert \
            -keystore "$KEYSTORE_PATH" \
            -alias androiddebugkey \
            -storepass android | sha256sum | cut -d ' ' -f 1)

          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "ERROR: Restored keystore certificate does not match the expected signing certificate"
            exit 1
          fi

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/yuukilyrics-release.keystore
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: androiddebugkey
          ANDROID_KEY_PASSWORD: android
        run: |
          flutter build apk --release --target-platform android-arm64 2>&1 | tee build.log

      - name: Verify APK signature
        env:
          EXPECTED_CERT_SHA256: 67356005284c1cac474ce25478b49de4abbc776660685a0f3089b083fe2a9b84
        run: |
          set -euo pipefail
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          ACTUAL_CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK_PATH" \
            | sed -n 's/.*certificate SHA-256 digest: //p' \
            | head -n 1)

          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "ERROR: APK certificate does not match the expected signing certificate"
            exit 1
          fi

      - name: Extract version info
        id: version
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION="${APP_VERSION%%+*}"
          if [[ "$APP_VERSION" == *"+"* ]]; then
            BUILD="${APP_VERSION#*+}"
            ARTIFACT_VERSION="${VERSION}+${BUILD}"
          else
            BUILD=""
            ARTIFACT_VERSION="$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$ARTIFACT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, Build: ${BUILD:-none}"

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          mkdir -p dist

          ARTIFACT_VERSION="${{ steps.version.outputs.artifact_version }}"

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file not found at $APK_PATH"
            exit 1
          fi

          cp "$APK_PATH" "dist/yuukilyrics-${ARTIFACT_VERSION}-android-arm64-release.apk"

          echo "Artifact prepared:"
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: yuukilyrics-android-arm64
          path: dist/yuukilyrics-${{ steps.version.outputs.artifact_version }}-android-arm64-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-android
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
